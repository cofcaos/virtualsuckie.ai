<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Virtual Suckie</title>
<style>
body {
  background:#111;
  color:#eee;
  font-family:Arial;
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header {
  padding:15px;
  background:#181818;
  font-size:20px;
}

#main {
  flex:1;
  display:flex;
}

#sidebar {
  width:250px;
  background:#1b1b1b;
  padding:15px;
  overflow-y:auto;
}

#content {
  flex:1;
  display:flex;
  flex-direction:column;
}

button {
  background:#333;
  color:white;
  border:none;
  padding:8px;
  margin-bottom:8px;
  width:100%;
  cursor:pointer;
}

button:hover { background:#444; }

textarea, input {
  background:#222;
  color:white;
  border:none;
  padding:8px;
  margin-bottom:10px;
  width:100%;
}

#chat {
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg { margin-bottom:12px; }

#inputArea {
  display:flex;
  padding:10px;
  background:#181818;
}

#inputArea input {
  flex:1;
  margin-right:10px;
}
</style>
</head>
<body>

<header>Virtual Suckie</header>

<div id="main">

<div id="sidebar">
  <button onclick="showHome()">Home</button>
  <button onclick="showCharacterEditor()">Add Character</button>
  <button onclick="showPersonaEditor()">Edit Persona</button>
  <div id="characterList"></div>
</div>

<div id="content"></div>

</div>

<script>

let characters = JSON.parse(localStorage.getItem("characters") || "[]");
let persona = JSON.parse(localStorage.getItem("persona") || "{}");
let currentCharacter = null;

function saveData() {
  localStorage.setItem("characters", JSON.stringify(characters));
  localStorage.setItem("persona", JSON.stringify(persona));
  renderCharacterList();
}

function renderCharacterList() {
  const list = document.getElementById("characterList");
  list.innerHTML = "";
  characters.forEach((c, index) => {
    const btn = document.createElement("button");
    btn.textContent = c.name;
    btn.onclick = () => openChat(index);
    list.appendChild(btn);
  });
}

function showHome() {
  document.getElementById("content").innerHTML =
  "<div style='padding:20px;'>Select or create a character.</div>";
}

function showCharacterEditor() {
  document.getElementById("content").innerHTML = `
    <div style="padding:20px;">
      <input id="charName" placeholder="Character name" />
      <textarea id="charDesc" rows="10" placeholder="Full character description"></textarea>
      <button onclick="addCharacter()">Save Character</button>
    </div>
  `;
}

function addCharacter() {
  const name = document.getElementById("charName").value;
  const desc = document.getElementById("charDesc").value;
  if (!name) return;
  characters.push({ name, desc });
  saveData();
  showHome();
}

function showPersonaEditor() {
  document.getElementById("content").innerHTML = `
    <div style="padding:20px;">
      <input id="personaName" placeholder="Your persona name" value="${persona.name || ""}" />
      <textarea id="personaDesc" rows="6" placeholder="Your persona description">${persona.desc || ""}</textarea>
      <button onclick="savePersona()">Save Persona</button>
    </div>
  `;
}

function savePersona() {
  persona = {
    name: document.getElementById("personaName").value,
    desc: document.getElementById("personaDesc").value
  };
  saveData();
  showHome();
}

function openChat(index) {
  currentCharacter = characters[index];

  document.getElementById("content").innerHTML = `
    <div id="chat"></div>
    <div id="inputArea">
      <input id="userInput" placeholder="Type here..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  `;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chat");
  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += `<div class="msg"><b>You:</b> ${text}</div>`;
  input.value = "";

  const response = await fetch("/api/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      message: text,
      character: currentCharacter,
      persona: persona
    })
  });

  const data = await response.json();
  chat.innerHTML += `<div class="msg"><b>${currentCharacter.name}:</b> ${data.reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

renderCharacterList();
showHome();

</script>
</body>
</html>
