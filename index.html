<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My AI</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .msg {
      margin-bottom: 15px;
      line-height: 1.4;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: #222;
    }

    input {
      flex: 1;
      padding: 10px;
      background: #333;
      border: none;
      color: white;
      outline: none;
    }

    button {
      padding: 10px 15px;
      background: #555;
      border: none;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #666;
    }
  </style>
</head>
<body>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="userInput" placeholder="Type here..." />
    <button id="sendBtn">Send</button>
  </div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("userInput");
  const button = document.getElementById("sendBtn");

  button.addEventListener("click", sendMessage);
  input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });

  async function sendMessage() {
    const userText = input.value.trim();
    if (!userText) return;

    chat.innerHTML += `<div class="msg"><b>You:</b> ${userText}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: userText })
      });

      const data = await response.json();

      if (!response.ok) {
        chat.innerHTML += `<div class="msg"><b>Error:</b> Something went wrong.</div>`;
        return;
      }

      chat.innerHTML += `<div class="msg"><b>AI:</b> ${data.reply}</div>`;
      chat.scrollTop = chat.scrollHeight;

    } catch (error) {
      chat.innerHTML += `<div class="msg"><b>Error:</b> Cannot reach server.</div>`;
    }
  }
</script>

</body>
</html>
