<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Virtual Suckie</title>
<style>
body { background:#111; color:#eee; font-family:Lucida Handwriting; margin:0; display:flex; height:100vh; }
#sidebar { width:260px; background:#1b1b1b; padding:15px; overflow-y:auto; }
#content { flex:1; display:flex; flex-direction:column; }
header { padding:15px; background:#181818; font-size:18px; }

button { background:#333; color:white; border:none; padding:8px; margin-bottom:8px; width:100%; cursor:pointer; }
button:hover { background:#444; }

input, textarea { background:#222; color:white; border:none; padding:8px; margin-bottom:10px; width:100%; }

#chat { flex:1; overflow-y:auto; padding:15px; }
.msg { margin-bottom:12px; white-space:pre-wrap; }

#inputArea { display:flex; padding:10px; background:#181818; }
#inputArea input { flex:1; margin-right:10px; }
</style>
</head>
<body>

<div id="sidebar">
  <button onclick="showHome()">Home</button>
  <button onclick="showCharacterEditor()">Add Character</button>
  <button onclick="showPersonaEditor()">Edit Persona</button>
  <div id="characterList"></div>
</div>

<div id="content">
  <header>Virtual Suckie</header>
  <div id="mainView"></div>
</div>

<script>

let characters = [];
let persona = {};
let currentCharacterIndex = null;
let currentConversationIndex = null;

async function loadData() {
  const res = await fetch("/api/data");
  const data = await res.json();
  characters = data.characters || [];
  persona = data.persona || {};
  renderCharacterList();
}

async function saveData() {
  await fetch("/api/data", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ characters, persona })
  });
}

function renderCharacterList() {
  const list = document.getElementById("characterList");
  list.innerHTML = "";
  characters.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.textContent = c.name;
    btn.onclick = () => openCharacter(i);
    list.appendChild(btn);
  });
}

function showHome() {
  document.getElementById("mainView").innerHTML =
    "<div style='padding:20px;'>Select a character.</div>";
}

function showCharacterEditor() {
  document.getElementById("mainView").innerHTML = `
    <div style="padding:20px;">
      <input id="charName" placeholder="Character name">
      <textarea id="charDesc" rows="8" placeholder="Full description"></textarea>
      <button onclick="addCharacter()">Save</button>
    </div>
  `;
}

async function addCharacter() {
  const name = document.getElementById("charName").value;
  const desc = document.getElementById("charDesc").value;
  if (!name) return;
  characters.push({ name, desc, conversations: [] });
  await saveData();
  await loadData();
  showHome();
}

function showPersonaEditor() {
  document.getElementById("mainView").innerHTML = `
    <div style="padding:20px;">
      <input id="personaName" placeholder="Persona name" value="${persona.name || ""}">
      <textarea id="personaDesc" rows="6" placeholder="Persona description">${persona.desc || ""}</textarea>
      <button onclick="savePersona()">Save Persona</button>
    </div>
  `;
}

async function savePersona() {
  persona = {
    name: document.getElementById("personaName").value,
    desc: document.getElementById("personaDesc").value
  };
  await saveData();
  showHome();
}

function openCharacter(index) {
  currentCharacterIndex = index;
  const char = characters[index];

  let convoButtons = `<button onclick="createConversation()">New Conversation</button>`;
  char.conversations.forEach((conv, i) => {
    convoButtons += `<button onclick="openConversation(${i})">${conv.title}</button>`;
  });

  document.getElementById("mainView").innerHTML =
    `<div style="padding:15px;">${convoButtons}</div>`;
}

async function createConversation() {
  const title = prompt("Conversation name:");
  if (!title) return;
  characters[currentCharacterIndex].conversations.push({
    title,
    messages:[]
  });
  await saveData();
  openCharacter(currentCharacterIndex);
}

function formatText(text) {
  return text.replace(/\*(.*?)\*/g, "<i>$1</i>");
}

function openConversation(index) {
  currentConversationIndex = index;
  const convo = characters[currentCharacterIndex].conversations[index];

  let chatHTML = `<div id="chat">`;
  convo.messages.forEach(m => {
    chatHTML += `<div class="msg"><b>${m.role}:</b> ${formatText(m.content)}</div>`;
  });

  chatHTML += `</div>
  <div id="inputArea">
    <input id="userInput">
    <button onclick="sendMessage()">Send</button>
  </div>`;

  document.getElementById("mainView").innerHTML = chatHTML;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  const convo = characters[currentCharacterIndex].conversations[currentConversationIndex];
  convo.messages.push({ role:"You", content:text });

  input.value="";
  openConversation(currentConversationIndex);

  const response = await fetch("/api/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      character: characters[currentCharacterIndex],
      persona: persona,
      messages: convo.messages
    })
  });

  const data = await response.json();
  convo.messages.push({
    role: characters[currentCharacterIndex].name,
    content:data.reply
  });

  await saveData();
  openConversation(currentConversationIndex);
}

loadData();
showHome();

</script>
</body>
</html>
